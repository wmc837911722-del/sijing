name: 企业服务咨询
description: 讨论企业部署、技术支持或定制开发需求（仅填写可公开信息）
title: "[服务咨询] "
body:
  - type: markdown
    attributes:
      value: |
        思径目前处于开发预览阶段，交付能力、范围和时间需要评估。
        仓库公开后此表单内容也会公开。不要填写密钥、密码、客户数据、内部地址或未脱敏源码；不必提供电话号码或邮箱。
  - type: dropdown
    id: service
    attributes:
      label: 希望获得的服务
      options:
        - 企业环境部署与接入
        - 业务知识初始化与核验
        - 技术支持与升级协助
        - 定制功能或集成
        - 尚不确定，希望先界定问题
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 希望解决的问题
      description: 描述一个具体工作场景，使用脱敏信息即可。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境与主要限制
      description: 可填写技术栈、操作系统、内网或离线要求等；不要填写服务器地址或凭证。
  - type: textarea
    id: outcome
    attributes:
      label: 期望交付和验收方式
      description: 描述什么结果对你有价值；可以注明时间要求，但无需公开采购金额。
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前确认
      options:
        - label: 我确认这些信息可以公开，不包含凭证、个人或客户敏感信息。
          required: true
