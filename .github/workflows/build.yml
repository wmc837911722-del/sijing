name: Sijing desktop builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.label }}
    # Private development: run expensive native packaging only on demand.
    # Public releases keep the existing push/PR build behavior.
    if: github.event_name == 'workflow_dispatch' || github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-2022
            arch: x64
          - label: macOS Intel
            os: macos-15-intel
            arch: x64
          - label: macOS Apple Silicon
            os: macos-15
            arch: arm64
          - label: Linux x64
            os: ubuntu-22.04
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PYTHONUTF8: '1'
      BUSINESSMAP_TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      # Build on Ubuntu 22.04 for its glibc baseline and normal unprivileged
      # namespaces. Keep Chromium sandboxing enabled in the packaged tests.
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth libgtk-3-0 libnss3 libgbm1 libasound2 libx11-xcb1 libxss1 libxtst6 libsecret-1-0 libfuse2 fonts-noto-cjk
      - name: Install Python environment
        run: node scripts/setup.mjs
      - name: Install desktop dependencies
        run: npm ci
      - name: Backend tests
        run: node scripts/test-backend.mjs
      - name: Desktop platform contracts
        run: npm run test:platform
      - name: Business UI and provider contracts
        run: npm run test:ui
      - name: Build desktop packages
        run: npm run package -- --${{ matrix.arch }}
      - name: Verify packaged desktop (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:packaged:all
      - name: Verify packaged desktop (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1200x24" npm run test:packaged:all
      - uses: actions/upload-artifact@v4
        with:
          name: Sijing-${{ runner.os }}-${{ runner.arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Verification-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
